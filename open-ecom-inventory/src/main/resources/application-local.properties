# =========================
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=true

# ==== Kafka Deserializer ====
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

#=== Type safety allow for Events ===
spring.kafka.consumer.properties.spring.json.trusted.packages=com.openecom.events

server.port=8082
# =============================

spring.datasource.url=jdbc:mysql://localhost:3306/open_ecom
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=rohan
spring.datasource.password=HareKrishna@12
# ============================

spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=none
logging.level.org.springframework.security=DEBUG
